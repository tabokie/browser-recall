<!DOCTYPE html>
<html style="opacity:0">
<head>
  <meta charset="UTF-8">
  <title>browser-recall</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      width: 400px;
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-ambient);
      background-attachment: fixed;
      padding: 8px;
    }

    .popup-shell {
      background: var(--bg-frosted);
      border: 1px solid var(--border-glass-strong);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-elevated), var(--highlight-top-strong), var(--highlight-edge);
      overflow: visible;
      position: relative;
    }

    .popup-shell::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: var(--glass-shine);
      pointer-events: none;
    }

    .header {
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border-section);
      background: var(--bg-sidebar);
      position: relative;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: var(--font-display-weight);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      margin-bottom: 2px;
    }

    .page-title:hover {
      color: var(--accent-primary);
    }

    .page-title-input {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: var(--font-display-weight);
      width: 100%;
      border: 1px solid var(--accent-primary);
      border-radius: var(--radius-sm);
      padding: 1px 6px;
      outline: none;
      background: var(--bg-input);
    }

    .page-url {
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .section {
      border-bottom: 1px solid var(--border-section);
      padding: 9px 16px;
      position: relative;
    }

    .section:last-child {
      border-bottom: none;
    }

    .section-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 6px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .section-action {
      background: none;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-pill);
      padding: 3px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      box-shadow: var(--highlight-top);
      transition: all 0.2s;
    }

    .section-action:hover {
      background: var(--bg-warm-hover);
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .snapshot-list {
      max-height: 120px;
      overflow-y: auto;
    }

    .snapshot-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      cursor: pointer;
    }

    .snapshot-time {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .snapshot-badges {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .snapshot-row:hover {
      background: var(--bg-surface-hover);
      border-radius: var(--radius-sm);
    }

    .badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }

    .badge.html {
      background: var(--accent-primary-soft);
      color: var(--accent-primary);
      border-color: var(--accent-primary-soft);
    }

    .badge.html:hover {
      border-color: var(--accent-primary);
      background: var(--accent-primary-glow);
    }

    .badge.md {
      background: var(--accent-blue-soft);
      color: var(--accent-blue);
      border-color: rgba(80, 128, 176, 0.12);
    }

    .badge.md:hover {
      border-color: var(--accent-blue);
      background: rgba(80, 128, 176, 0.15);
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-muted);
      padding: 0 2px;
    }

    .delete-btn:hover {
      color: var(--accent-red);
    }

    .attention-grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .attention-item {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .attention-item strong {
      color: var(--text-primary);
    }

    .notes-scroll {
      max-height: 200px;
      overflow-y: auto;
    }

    .highlight-list {
    }

    .highlight-item {
      padding: 6px 0;
      border-bottom: 1px solid var(--border-section);
      position: relative;
    }

    .highlight-item:last-child {
      border-bottom: none;
    }

    .highlight-header {
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }

    .highlight-text {
      flex: 1;
      font-size: 12px;
      color: var(--text-primary);
      font-style: italic;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .highlight-delete {
      width: 20px;
      height: 20px;
      border: none;
      background: none;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      line-height: 1;
      padding: 0;
    }

    .highlight-delete:hover {
      background: var(--accent-red-soft);
      color: var(--accent-red);
    }

    .highlight-note {
      width: 100%;
      font-size: 11px;
      line-height: 1.4;
      padding: 6px 10px;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      resize: none;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 1.4em;
      background: var(--bg-input);
      color: var(--text-primary);
      box-shadow: var(--highlight-top);
    }

    .highlight-note:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-primary-soft), var(--highlight-top);
    }

    .page-note {
      width: 100%;
      font-size: 13px;
      line-height: 1.4;
      padding: 10px 13px;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      resize: vertical;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 48px;
      background: var(--bg-input);
      color: var(--text-primary);
      box-shadow: var(--highlight-top);
      margin-bottom: 8px;
    }

    .page-note:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-primary-soft), 0 0 10px var(--accent-primary-soft), var(--highlight-top);
    }

    .highlight-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .empty-state {
      font-size: 12px;
      color: var(--text-muted);
      padding: 8px 0;
      text-align: center;
    }

    .list-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .list-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 13px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 500;
      background: var(--bg-warm-tint);
      color: var(--text-secondary);
      cursor: pointer;
      border: 1px solid var(--border-glass);
      box-shadow: var(--highlight-top);
      transition: all 0.2s;
    }

    .list-chip:hover {
      background: var(--bg-warm-hover);
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .list-chip.selected {
      background: var(--accent-primary-soft);
      color: var(--accent-primary);
      border-color: var(--accent-primary-glow);
      box-shadow: 0 1px 4px var(--accent-primary-soft), var(--highlight-top);
    }

    .list-add-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 13px;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      background: var(--bg-warm-tint);
      box-shadow: var(--highlight-top);
      transition: all 0.2s;
      user-select: none;
      flex-shrink: 0;
    }

    .list-add-btn:hover {
      background: var(--bg-warm-hover);
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .list-chips-wrap {
      position: relative;
    }

    .list-picker {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: var(--bg-surface-solid);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-elevated);
      z-index: 100;
      overflow: hidden;
    }

    .list-picker-input {
      width: 100%;
      font-size: 11px;
      padding: 8px 12px;
      border: none;
      border-bottom: 1px solid var(--border-section);
      outline: none;
      font-family: var(--font-body);
      box-sizing: border-box;
      background: transparent;
      color: var(--text-primary);
    }

    .list-picker-input::placeholder {
      color: var(--text-muted);
    }

    .list-picker-input:focus {
      border-bottom-color: var(--accent-primary);
    }

    .list-picker-list {
      max-height: 160px;
      overflow-y: auto;
    }

    .list-picker-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      font-size: 11px;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.1s;
    }

    .list-picker-row:hover {
      background: var(--bg-surface-hover);
    }

    .list-picker-row.selected {
      color: var(--accent-primary);
    }

    .list-picker-row-check {
      width: 14px;
      font-size: 10px;
      text-align: center;
      flex-shrink: 0;
    }

    .list-picker-create {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
      cursor: pointer;
      transition: background 0.1s;
    }

    .list-picker-create:hover {
      background: var(--bg-surface-hover);
      color: var(--text-secondary);
    }

    #dashboard {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .shortcut-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 0 0 8px;
    }

    .shortcut-bar-item {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .open-settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px;
      display: flex;
      align-items: center;
      border-radius: 50%;
      transition: color 0.15s, background 0.15s;
    }

    .open-settings-btn:hover {
      color: var(--accent-primary);
      background: var(--accent-primary-soft);
    }

    .workspace-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }

    .workspace-header {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tri-toggle {
      display: flex;
      gap: 3px;
      background: var(--bg-warm-tint);
      border-radius: var(--radius-pill);
      padding: 3px;
      width: fit-content;
      border: 1px solid var(--border-glass);
      box-shadow: var(--highlight-top), var(--highlight-edge);
    }

    .tri-toggle-knob {
      display: none;
    }

    .tri-toggle-zone {
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .tri-toggle-zone:hover {
      color: var(--text-secondary);
    }

    /* Default mode: center zone is active */
    .tri-toggle-zone.center {
      background: var(--bg-tab-active);
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: var(--shadow-float);
      border-color: var(--border-glass);
    }

    /* Workspace mode: left zone is active, center reverts */
    .tri-toggle.mode-workspace .tri-toggle-zone.center {
      background: transparent;
      color: var(--text-muted);
      font-weight: 500;
      box-shadow: none;
      border-color: transparent;
    }
    .tri-toggle.mode-workspace .tri-toggle-zone.left {
      background: var(--bg-tab-active);
      color: var(--accent-primary);
      font-weight: 600;
      box-shadow: var(--shadow-float);
      border-color: var(--border-glass);
    }

    /* Private mode: right zone is active, center reverts */
    .tri-toggle.mode-private .tri-toggle-zone.center {
      background: transparent;
      color: var(--text-muted);
      font-weight: 500;
      box-shadow: none;
      border-color: transparent;
    }
    .tri-toggle.mode-private .tri-toggle-zone.right {
      background: var(--bg-tab-active);
      color: var(--accent-primary-hover);
      font-weight: 600;
      box-shadow: var(--shadow-float);
      border-color: var(--border-glass);
    }

    .workspace-config {
      margin-top: 8px;
    }

    .workspace-list-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .workspace-lists {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 6px;
    }

    .ws-list-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 10px;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      background: var(--bg-warm-tint);
      color: var(--text-secondary);
      box-shadow: var(--highlight-top);
      transition: all 0.2s;
    }

    .ws-list-chip:hover {
      background: var(--bg-warm-hover);
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .ws-list-chip.selected {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #fff;
      box-shadow: 0 1px 4px var(--accent-primary-glow);
    }

    .workspace-auto-snapshot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .workspace-auto-snapshot input {
      margin: 0;
    }

    .workspace-empty {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
    }

    .shortcut-hint {
      font-size: 10px;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .loading {
      padding: 32px;
    }

    .blacklisted {
      text-align: center;
      padding: 32px 24px;
      color: var(--text-secondary);
    }

    .blacklisted-icon {
      font-size: 32px;
      margin-bottom: 8px;
      color: var(--accent-red);
    }

    .blacklisted-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-red);
      margin-bottom: 4px;
    }

    .blacklisted-url {
      font-size: 11px;
      color: var(--text-muted);
      word-break: break-all;
      margin-bottom: 12px;
    }

    .capture-once-btn {
      padding: 6px 16px;
      border: none;
      border-radius: var(--radius-pill);
      background: linear-gradient(145deg, var(--accent-primary), var(--accent-primary-hover));
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow:
        0 1px 2px var(--accent-primary-glow),
        0 3px 8px var(--accent-primary-glow),
        var(--btn-glow);
    }

    .capture-once-btn:hover {
      background: linear-gradient(145deg, var(--accent-primary), var(--accent-primary-hover));
      filter: brightness(1.08);
    }

    .capture-once-btn:disabled {
      background: var(--text-muted);
      border-color: var(--text-muted);
      cursor: default;
    }

    .blacklisted-hint {
      font-size: 11px;
      color: var(--text-muted);
    }

    .blacklisted-hint a {
      color: var(--accent-primary);
      cursor: pointer;
      text-decoration: none;
    }

    .blacklisted-hint a:hover {
      text-decoration: underline;
    }
  </style>
  <link rel="stylesheet" href="dark-theme.css">
  <link rel="stylesheet" href="color-schemes.css">
</head>
<body>
  <div id="loading" class="popup-shell loading"><span class="spinner"></span></div>

  <div id="blacklisted" class="popup-shell blacklisted" style="display: none;">
    <div class="blacklisted-icon">&#x26D4;</div>
    <div class="blacklisted-title">Blacklisted</div>
    <div class="blacklisted-url" id="blacklistedUrl"></div>
    <button class="capture-once-btn" id="captureOnceBtn">Capture It</button>
    <div class="blacklisted-hint">This site is on your blocklist. <a id="blacklistSettingsLink">Manage in Settings</a></div>
  </div>

  <div id="dashboard" style="display: none;">
    <div class="workspace-bar" id="workspaceBar">
      <div class="workspace-header">
        <div class="tri-toggle" id="triToggle">
          <div class="tri-toggle-knob"></div>
          <div class="tri-toggle-zone left" role="button" tabindex="0" data-mode="workspace">Workspace</div>
          <div class="tri-toggle-zone center" role="button" tabindex="0" data-mode="default">Default</div>
          <div class="tri-toggle-zone right" role="button" tabindex="0" data-mode="private">Private</div>
        </div>
      </div>
      <div class="workspace-config" id="workspaceConfig" style="display: none;">
        <div class="workspace-list-label">Tag pages with:</div>
        <div class="workspace-lists" id="workspaceLists"></div>
        <label class="workspace-auto-snapshot">
          <input type="checkbox" id="workspaceAutoSnapshot">
          <span>Auto-snapshot visited pages</span>
        </label>
      </div>
    </div>

    <div class="popup-shell" id="dashboardContent">
      <div class="header">
        <div class="page-title" id="pageTitle">—</div>
        <div class="page-url" id="pageUrl">—</div>
      </div>

      <div class="section" id="visitsLikesSection" style="display:none">
        <div class="attention-grid" id="attentionGrid"></div>
      </div>

      <div class="section">
        <div class="list-chips-wrap">
          <div class="list-chips" id="listChips"></div>
        </div>
      </div>

      <div class="section">
        <div class="notes-scroll">
          <textarea class="page-note" id="pageNote" placeholder="Add a page note..."></textarea>
          <div class="highlight-list" id="highlightList"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <button class="section-action" id="captureBtn">+ Capture</button>
        </div>
        <div class="snapshot-list" id="snapshotList"></div>
      </div>
    </div>

    <div class="shortcut-bar">
      <div class="shortcut-bar-item"><span class="shortcut-hint">Alt+H</span> Highlight</div>
      <div class="shortcut-bar-item"><span class="shortcut-hint">Alt+S</span> Snapshot</div>
      <button class="open-settings-btn" id="openSettingsBtn" title="Open main page">
        <svg viewBox="0 0 16 16" width="12" height="12"><path fill="currentColor" d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/></svg>
      </button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
