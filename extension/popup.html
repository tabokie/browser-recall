<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Portal Search</title>
  <style>
    body {
      width: 400px;
      min-height: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 16px 0;
      color: #333;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    button {
      padding: 8px 16px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #357ae8;
    }

    .ranking-options {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .ranking-btn {
      padding: 6px 12px;
      background: #f1f3f4;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 16px;
      cursor: pointer;
      font-size: 12px;
    }

    .ranking-btn.active {
      background: #e8f0fe;
      border-color: #4285f4;
      color: #4285f4;
    }

    .results {
      max-height: 400px;
      overflow-y: auto;
    }

    .result-item {
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }

    .result-item:hover {
      background: #f8f9fa;
    }

    .result-title {
      font-weight: 500;
      color: #1a73e8;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .result-url {
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-time {
      font-size: 11px;
      color: #999;
    }

    .no-results {
      text-align: center;
      color: #999;
      padding: 32px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Portal Search</h1>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search your interactions...">
    <button id="searchBtn">Search</button>
  </div>

  <div class="ranking-options">
    <button class="ranking-btn active" data-algorithm="0">Content</button>
    <button class="ranking-btn" data-algorithm="1">Context</button>
    <button class="ranking-btn" data-algorithm="2">Lineage</button>
    <button class="ranking-btn" data-algorithm="3">Attention</button>
    <button class="ranking-btn" data-algorithm="4">Hybrid</button>
  </div>

  <div class="results" id="results">
    <div class="no-results">Enter a search query to find your interactions</div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
