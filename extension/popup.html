<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 400px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #333;
    }

    .header {
      padding: 12px 16px;
      border-bottom: 1px solid #e0e0e0;
      background: #fafafa;
    }

    .page-title {
      font-size: 15px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page-url {
      font-size: 11px;
      color: #888;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
    }

    .section {
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 16px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
    }

    .section-action {
      background: none;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 12px;
      color: #555;
    }

    .section-action:hover {
      background: #f0f0f0;
    }

    .snapshot-list {
      max-height: 120px;
      overflow-y: auto;
    }

    .snapshot-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .snapshot-time {
      font-size: 12px;
      color: #444;
    }

    .snapshot-badges {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .badge {
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      background: #e8f0fe;
      color: #1967d2;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #999;
      padding: 0 2px;
    }

    .delete-btn:hover {
      color: #ea4335;
    }

    .attention-grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .attention-item {
      font-size: 12px;
      color: #555;
    }

    .attention-item strong {
      color: #333;
    }

    .highlight-list {
      max-height: 150px;
      overflow-y: auto;
    }

    .highlight-item {
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .highlight-item:last-child {
      border-bottom: none;
    }

    .highlight-text {
      font-size: 12px;
      color: #333;
      font-style: italic;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .highlight-note {
      width: 100%;
      font-size: 11px;
      padding: 3px 6px;
      border: 1px solid #ddd;
      border-radius: 3px;
      resize: none;
      font-family: inherit;
    }

    .highlight-note:focus {
      outline: none;
      border-color: #4285f4;
    }

    .highlight-label {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }

    .empty-state {
      font-size: 12px;
      color: #999;
      padding: 8px 0;
      text-align: center;
    }

    .shortcut-hint {
      font-size: 10px;
      color: #aaa;
      margin-left: 4px;
    }

    .loading {
      text-align: center;
      padding: 32px;
      color: #999;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">Loading...</div>

  <div id="dashboard" style="display: none;">
    <div class="header">
      <div class="page-title" id="pageTitle">—</div>
      <div class="page-url" id="pageUrl">—</div>
    </div>

    <div class="section">
      <div class="section-header">
        <span class="section-title">Snapshots</span>
        <span>
          <span class="shortcut-hint">Alt+S</span>
          <button class="section-action" id="captureBtn">+ Capture</button>
        </span>
      </div>
      <div class="snapshot-list" id="snapshotList">
        <div class="empty-state">No snapshots yet</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <span class="section-title">Attention</span>
      </div>
      <div class="attention-grid" id="attentionGrid">
        <div class="empty-state">No data</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <span class="section-title">Notes &amp; Highlights</span>
        <span class="shortcut-hint">Alt+H</span>
      </div>
      <div class="highlight-list" id="highlightList">
        <div class="empty-state">No highlights</div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
