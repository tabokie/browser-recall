name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, Coverage and Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-checks
      - run: npm ci

      - name: Install PowerShell 7.6.6 for portable rollback checks
        run: |
          powershell_dir="$RUNNER_TEMP/powershell-7.6.6"
          mkdir -p "$powershell_dir"
          curl --fail --location --silent --show-error \
            https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/powershell-7.6.6-linux-x64.tar.gz \
            -o "$RUNNER_TEMP/powershell.tar.gz"
          echo "ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc  $RUNNER_TEMP/powershell.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/powershell.tar.gz" -C "$powershell_dir"
          chmod +x "$powershell_dir/pwsh"
          echo "$powershell_dir" >> "$GITHUB_PATH"
      - name: Check test prerequisites before expensive checks
        run: npm run ci:check-prerequisites

      - name: Validate release versions before expensive builds
        run: node scripts/lib/product-version.mjs
      - name: Verify committed README image integrity
        run: npm run ci:check-docs -- --images-only
      - name: Validate GitHub workflows with actionlint 1.7.12
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - run: npm run ci:lint-js
      - name: Run JavaScript tests once with coverage
        run: npm run coverage:js

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust coverage tooling
        run: cargo install cargo-llvm-cov --version 0.8.5 --locked
      - run: npm run ci:lint-rust
      - name: Install Playwright Chromium
        run: npm run ci:install-playwright
      - run: npm run test:cold-scripts
      - name: Run Rust workspace tests once with coverage
        run: npm run coverage:rust
      - run: npm run coverage:monitor

  test-extension-e2e:
    name: Extension E2E Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Install Playwright Chromium
        run: npm run ci:install-playwright

      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: '157.0.1'

      - run: npm run ci:test-extension-e2e
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}

      - name: Report native popup measurements after a failure
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          for (const file of fs.globSync('test-results/**/fatal-*-layout.json')) {
            const measurement = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (measurement === null) {
              console.log(`::notice title=${path.basename(file)}::Popup measurements were unavailable before the test failed.`);
              continue;
            }
            const { messageText, ...layout } = measurement;
            console.log(`::notice title=${path.basename(file)}::${JSON.stringify(layout).replaceAll('%', '%25')}`);
          }
          JS

      - name: Preserve extension E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: extension-e2e-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  test-desktop-visual:
    name: Desktop Visual Regression
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright desktop visual browsers
        timeout-minutes: 10
        run: npm run ci:install-desktop-visual-browsers

      - run: npm run ci:test-desktop-visual

      - name: Preserve synthetic visual failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-visual-failure-screenshots
          path: |
            test-results/**/*-expected.png
            test-results/**/*-actual.png
            test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 7

  desktop-release:
    name: Desktop Release Validation
    uses: ./.github/workflows/desktop-release-validation.yml
    with:
      production: false
