name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Verify committed README image integrity
        run: npm run ci:check-docs -- --images-only

      - run: npm run ci:test

  documentation-screenshots:
    name: Generate README Screenshots
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: documentation-screenshots-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - run: npm run ci:install-playwright

      - name: Capture native app and browser windows, compose and verify images
        run: npm run ci:generate-docs

      - name: Preserve generated documentation
        uses: actions/upload-artifact@v7
        with:
          name: readme-screenshots
          path: docs/images/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve capture failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-capture-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish refreshed images on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/images/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh generated README screenshots'
          git push origin HEAD:main

  test-extension-e2e:
    name: Extension E2E Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Install Playwright Chromium
        run: npm run ci:install-playwright

      - run: npm run ci:test-extension-e2e

  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - run: npm run ci:test-rust

  test-desktop-visual:
    name: Desktop Visual Regression
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright desktop visual browsers
        timeout-minutes: 10
        run: npm run ci:install-desktop-visual-browsers

      - run: npm run ci:test-desktop-visual

      - name: Preserve synthetic visual failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-visual-failure-screenshots
          path: |
            test-results/**/*-expected.png
            test-results/**/*-actual.png
            test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 7

  cold-scripts:
    name: Cold Script Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Rust coverage tooling
        run: cargo install cargo-llvm-cov --version 0.8.5 --locked

      - name: Install Playwright Chromium
        run: npm run ci:install-playwright

      - run: npm run ci:cold-scripts

  test-desktop-native-bundle:
    name: Desktop Native Lifecycle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - run: npm run build --workspace @browser-recall/desktop

      - name: Exercise native startup and tray lifecycle
        env:
          BROWSER_RECALL_ISOLATED_MACOS_SESSION: '1'
        run: node tests/smoke/macos-desktop-window-lifecycle.mjs

  test-desktop-single-instance:
    name: Desktop Windows Single Instance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - run: npm run ci:test-windows-cleanup

      - run: npm run build --workspace @browser-recall/desktop

      - run: npm run ci:test-windows-artifacts

      - name: Install Playwright Chromium
        run: npm run ci:install-playwright

      - name: Verify Windows extension system-font fallback
        run: npm run ci:test-windows-extension-font

      - name: Exercise native single-instance deep-link forwarding
        run: npm run test:desktop-single-instance

  lint-js:
    name: Lint & Format (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run ci:lint-js

  lint-rust:
    name: Lint & Format (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - run: npm run ci:lint-rust
