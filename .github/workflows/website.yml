name: Product Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build-website.mjs'
      - 'scripts/lib/documentation-seed.mjs'
      - 'scripts/serve-website.mjs'
      - 'tests/website/**'
      - 'playwright.website.config.js'
      - 'icons/browser-recall-default.svg'
      - 'apps/desktop/ui/**'
      - 'apps/extension/popup.html'
      - 'apps/extension/popup-list-elements.js'
      - 'apps/extension/extension-surface.js'
      - 'apps/extension/utils.js'
      - 'apps/extension/color-schemes.css'
      - 'packages/core/**'
      - 'docs/images/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build-website.mjs'
      - 'scripts/lib/documentation-seed.mjs'
      - 'scripts/serve-website.mjs'
      - 'tests/website/**'
      - 'playwright.website.config.js'
      - 'icons/browser-recall-default.svg'
      - 'apps/desktop/ui/**'
      - 'apps/extension/popup.html'
      - 'apps/extension/popup-list-elements.js'
      - 'apps/extension/extension-surface.js'
      - 'apps/extension/utils.js'
      - 'apps/extension/color-schemes.css'
      - 'packages/core/**'
      - 'docs/images/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Build, check and publish product website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      # Pull requests run checks without entering the deployment environment.
      name: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'github-pages' || '' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci:install-desktop-visual-browsers
      - run: npm run test:website
      - name: Preserve website failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: product-website-failure-artifacts
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/website
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - name: Deploy product website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
