<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Extension — Function Call Graph</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0f;
    --bg-panel: #111318;
    --bg-panel-hover: #181b22;
    --border: #1e2130;
    --border-bright: #2a2e42;
    --text: #c8cdd8;
    --text-dim: #5a6078;
    --text-bright: #e8ecf4;
    --accent: #6c8aff;
    --accent-dim: #3a4a8a;
    --glow: rgba(108, 138, 255, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #graph-canvas {
    position: absolute;
    inset: 0;
  }

  svg { display: block; }

  /* ── Left Panel ── */
  #left-panel {
    position: fixed;
    top: 0;
    left: 0;
    width: 260px;
    height: 100vh;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    z-index: 10;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #left-panel .panel-header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #left-panel .panel-header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-bright);
    margin-bottom: 4px;
  }

  #left-panel .panel-header .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  /* Search */
  #search-box {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #search-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text-bright);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  #search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--glow); }
  #search-input::placeholder { color: var(--text-dim); }

  /* File list */
  #file-filters {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  #file-filters::-webkit-scrollbar { width: 4px; }
  #file-filters::-webkit-scrollbar-track { background: transparent; }
  #file-filters::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

  .file-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    cursor: pointer;
    transition: background 0.15s;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    user-select: none;
  }
  .file-item:hover { background: var(--bg-panel-hover); }
  .file-item.dimmed { opacity: 0.35; }

  .file-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .file-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  .file-count {
    color: var(--text-dim);
    font-size: 10px;
    flex-shrink: 0;
  }

  /* Stats bar */
  #stats-bar {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    flex-shrink: 0;
    line-height: 1.6;
  }

  /* ── Right Detail Panel ── */
  #detail-panel {
    position: fixed;
    top: 0;
    right: -340px;
    width: 340px;
    height: 100vh;
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    z-index: 10;
    transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #detail-panel.open { right: 0; }

  #detail-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
    z-index: 1;
  }
  #detail-close:hover { border-color: var(--accent); color: var(--text-bright); }

  #detail-header {
    padding: 20px 16px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #detail-func-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-bright);
    word-break: break-all;
    padding-right: 36px;
  }

  #detail-file-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding: 3px 10px;
    border-radius: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text);
  }

  #detail-file-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  #detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  #detail-body::-webkit-scrollbar { width: 4px; }
  #detail-body::-webkit-scrollbar-track { background: transparent; }
  #detail-body::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

  .detail-section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 16px 0 8px;
  }
  .detail-section-title:first-child { margin-top: 0; }

  .detail-list {
    list-style: none;
  }

  .detail-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .detail-list li:hover { background: var(--bg-panel-hover); }
  .detail-list li .ref-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .detail-list li .ref-file {
    color: var(--text-dim);
    font-size: 10px;
    margin-left: auto;
    flex-shrink: 0;
  }

  .detail-empty {
    font-size: 11px;
    color: var(--text-dim);
    font-style: italic;
    padding: 4px 8px;
  }

  /* ── Tooltip ── */
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: #1a1d28;
    border: 1px solid var(--border-bright);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-bright);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    z-index: 100;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 280px;
  }
  #tooltip.visible { opacity: 1; }
  #tooltip .tt-file { color: var(--text-dim); font-size: 10px; margin-top: 2px; }
  #tooltip .tt-line { color: var(--accent); font-size: 10px; }

  /* ── Keyboard hint ── */
  #kb-hint {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    z-index: 5;
    opacity: 0.7;
    pointer-events: none;
  }

  /* Links / edges */
  .link {
    fill: none;
    stroke-opacity: 0.12;
  }

  .link-arrow {
    fill-opacity: 0.18;
  }

  /* Highlighted state */
  .link.highlighted { stroke-opacity: 0.6; }
  .link-arrow.highlighted { fill-opacity: 0.7; }
  .link.search-hit { stroke-opacity: 0.5; stroke: var(--accent) !important; }
  .link-arrow.search-hit { fill-opacity: 0.6; fill: var(--accent) !important; }

  .node-circle {
    stroke-width: 1.5;
    cursor: pointer;
    transition: r 0.2s;
  }

  .node-label {
    font-family: 'JetBrains Mono', monospace;
    fill: var(--text);
    pointer-events: none;
    user-select: none;
  }

  .node-circle.dimmed { opacity: 0.08; }
  .node-label.dimmed { opacity: 0.04; }
  .link.dimmed { stroke-opacity: 0.02; }
  .link-arrow.dimmed { fill-opacity: 0.02; }

  .node-circle.search-hit {
    stroke: var(--accent) !important;
    stroke-width: 3 !important;
    filter: drop-shadow(0 0 6px var(--accent));
  }
</style>
</head>
<body>

<!-- Left panel -->
<div id="left-panel">
  <div class="panel-header">
    <h1>Function Graph</h1>
    <div class="subtitle">Portal Extension</div>
  </div>
  <div id="search-box">
    <input id="search-input" type="text" placeholder="Search functions…" spellcheck="false" autocomplete="off">
  </div>
  <div id="file-filters"></div>
  <div id="stats-bar"></div>
</div>

<!-- Right detail panel -->
<div id="detail-panel">
  <button id="detail-close">&times;</button>
  <div id="detail-header">
    <div id="detail-func-name"></div>
    <div id="detail-file-badge"><span id="detail-file-dot"></span><span id="detail-file-label"></span> : <span id="detail-line-num"></span></div>
  </div>
  <div id="detail-body"></div>
</div>

<!-- Tooltip -->
<div id="tooltip">
  <div class="tt-name"></div>
  <div class="tt-file"></div>
  <div class="tt-line"></div>
</div>

<!-- Keyboard hint -->
<div id="kb-hint">Scroll to zoom · Drag to pan · Click node for details · Esc to deselect</div>

<!-- Graph container -->
<div id="graph-canvas"></div>

const nameToNodes = Object.create(null); // funcName -> [nodeIds]

fileNames.forEach(file => {
  const funcs = RAW_DATA.files[file].functions;
  funcs.forEach(fn => {
    const id = `${file}:${fn.name}`;
    const node = { id, name: fn.name, file, line: fn.line, color: fileColorMap[file], outCalls: fn.calls, inDegree: 0, outDegree: fn.calls.length };
    nodes.push(node);
    nodeMap[id] = node;
    if (!nameToNodes[fn.name]) nameToNodes[fn.name] = [];
    nameToNodes[fn.name].push(id);
  });
});

// Resolve edges — prefer same-file targets, else first found
const edges = [];
const edgeSet = new Set();
nodes.forEach(srcNode => {
  srcNode.outCalls.forEach(callName => {
    // Prefer same-file target
    const sameFile = `${srcNode.file}:${callName}`;
    let targetId = null;
    if (nodeMap[sameFile]) {
      targetId = sameFile;
    } else if (nameToNodes[callName] && nameToNodes[callName].length > 0) {
      targetId = nameToNodes[callName][0];
    }
    if (targetId && targetId !== srcNode.id) {
      const ek = `${srcNode.id}->${targetId}`;
      if (!edgeSet.has(ek)) {
        edgeSet.add(ek);
        edges.push({ source: srcNode.id, target: targetId });
        nodeMap[targetId].inDegree++;
      }
    }
  });
});

// Calculate node sizes
const maxDegree = Math.max(...nodes.map(n => n.inDegree + n.outDegree), 1);
nodes.forEach(n => {
  const deg = n.inDegree + n.outDegree;
  n.radius = 3 + Math.sqrt(deg / maxDegree) * 14;
  n.labelSize = Math.max(7, Math.min(11, 7 + deg * 0.3));
});

// ── Stats ──
document.getElementById('stats-bar').innerHTML =
  `${nodes.length} functions · ${edges.length} edges<br>${fileNames.length} source files`;

// ── File filter panel ──
const hiddenFiles = new Set();
const filterContainer = document.getElementById('file-filters');

fileNames.forEach(file => {
  const count = RAW_DATA.files[file].functions.length;
  const div = document.createElement('div');
  div.className = 'file-item';
  div.dataset.file = file;
  div.innerHTML = `<span class="file-dot" style="background:${fileColorMap[file]}"></span>
    <span class="file-name">${file}</span>
    <span class="file-count">${count}</span>`;
  div.addEventListener('click', () => {
    if (hiddenFiles.has(file)) {
      hiddenFiles.delete(file);
      div.classList.remove('dimmed');
    } else {
      hiddenFiles.add(file);
      div.classList.add('dimmed');
    }
    applyVisibility();
  });
  filterContainer.appendChild(div);
});

// ── D3 Setup ──
const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select('#graph-canvas')
  .append('svg')
  .attr('width', width)
  .attr('height', height);

// Defs for arrow markers per file color
const defs = svg.append('defs');

// One arrowhead per color
const uniqueColors = [...new Set(Object.values(fileColorMap))];
uniqueColors.forEach(color => {
  const markerId = 'arrow-' + color.replace('#', '');
  defs.append('marker')
    .attr('id', markerId)
    .attr('viewBox', '0 -4 8 8')
    .attr('refX', 12)
    .attr('refY', 0)
    .attr('markerWidth', 6)
    .attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-3L7,0L0,3Z')
    .attr('class', 'link-arrow')
    .attr('fill', color);
});

const g = svg.append('g');

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.1, 6])
  .on('zoom', (e) => g.attr('transform', e.transform));
svg.call(zoom);

// Initial centering
svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.7));

// ── Simulation ──
const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(edges).id(d => d.id).distance(60).strength(0.3))
  .force('charge', d3.forceManyBody().strength(-120).distanceMax(400))
  .force('center', d3.forceCenter(0, 0))
  .force('collision', d3.forceCollide().radius(d => d.radius + 4))
  .force('x', d3.forceX(0).strength(0.03))
  .force('y', d3.forceY(0).strength(0.03))
  .alphaDecay(0.02);

// ── Draw edges ──
const linkSelection = g.append('g')
  .selectAll('line')
  .data(edges)
  .join('line')
  .attr('class', 'link')
  .attr('stroke', d => nodeMap[d.source.id || d.source]?.color || '#444')
  .attr('stroke-width', 1)
  .attr('marker-end', d => {
    const c = nodeMap[d.source.id || d.source]?.color || '#444';
    return `url(#arrow-${c.replace('#', '')})`;
  });

// ── Draw nodes ──
const nodeGroup = g.append('g')
  .selectAll('g')
  .data(nodes)
  .join('g')
  .attr('class', 'node-group');

const circles = nodeGroup.append('circle')
  .attr('class', 'node-circle')
  .attr('r', d => d.radius)
  .attr('fill', d => d.color)
  .attr('fill-opacity', 0.7)
  .attr('stroke', d => d.color)
  .attr('stroke-opacity', 0.4);

const labels = nodeGroup.append('text')
  .attr('class', 'node-label')
  .attr('dy', d => d.radius + 12)
  .attr('text-anchor', 'middle')
  .attr('font-size', d => d.labelSize)
  .text(d => d.name);

// ── Drag ──
nodeGroup.call(d3.drag()
  .on('start', (e, d) => {
    if (!e.active) simulation.alphaTarget(0.1).restart();
    d.fx = d.x; d.fy = d.y;
  })
  .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
  .on('end', (e, d) => {
    if (!e.active) simulation.alphaTarget(0);
    d.fx = null; d.fy = null;
  })
);

// ── Tick ──
simulation.on('tick', () => {
  linkSelection
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);
  nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
});

// ── Hover: highlight connected ──
const tooltip = document.getElementById('tooltip');
let hoverNode = null;

function getConnected(nodeId) {
  const connected = new Set([nodeId]);
  const connEdges = new Set();
  edges.forEach((e, i) => {
    const sid = e.source.id || e.source;
    const tid = e.target.id || e.target;
    if (sid === nodeId || tid === nodeId) {
      connected.add(sid);
      connected.add(tid);
      connEdges.add(i);
    }
  });
  return { connected, connEdges };
}

nodeGroup.on('mouseenter', (e, d) => {
  if (selectedNode) return;
  hoverNode = d.id;
  const { connected, connEdges } = getConnected(d.id);
  applyHighlight(connected, connEdges);
  // Tooltip
  tooltip.querySelector('.tt-name').textContent = d.name;
  tooltip.querySelector('.tt-file').textContent = d.file;
  tooltip.querySelector('.tt-line').textContent = `line ${d.line}`;
  tooltip.classList.add('visible');
});

nodeGroup.on('mousemove', (e) => {
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top = (e.clientY - 10) + 'px';
});

nodeGroup.on('mouseleave', () => {
  if (selectedNode) return;
  hoverNode = null;
  clearHighlight();
  tooltip.classList.remove('visible');
});

function applyHighlight(connected, connEdges) {
  circles.classed('dimmed', d => !connected.has(d.id));
  labels.classed('dimmed', d => !connected.has(d.id));
  linkSelection.classed('dimmed', (d, i) => !connEdges.has(i));
  linkSelection.classed('highlighted', (d, i) => connEdges.has(i));
}

function clearHighlight() {
  circles.classed('dimmed', false);
  labels.classed('dimmed', false);
  linkSelection.classed('dimmed', false).classed('highlighted', false);
}

// ── Click: detail panel ──
let selectedNode = null;

nodeGroup.on('click', (e, d) => {
  e.stopPropagation();
  selectedNode = d.id;
  tooltip.classList.remove('visible');

  const { connected, connEdges } = getConnected(d.id);
  applyHighlight(connected, connEdges);
  showDetail(d);
});

svg.on('click', () => {
  selectedNode = null;
  clearHighlight();
  document.getElementById('detail-panel').classList.remove('open');
});

document.getElementById('detail-close').addEventListener('click', () => {
  selectedNode = null;
  clearHighlight();
  document.getElementById('detail-panel').classList.remove('open');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    selectedNode = null;
    clearHighlight();
    document.getElementById('detail-panel').classList.remove('open');
    document.getElementById('search-input').value = '';
    clearSearch();
  }
});

function showDetail(d) {
  const panel = document.getElementById('detail-panel');
  panel.classList.add('open');

  document.getElementById('detail-func-name').textContent = d.name;
  document.getElementById('detail-file-dot').style.background = d.color;
  document.getElementById('detail-file-label').textContent = d.file;
  document.getElementById('detail-line-num').textContent = `L${d.line}`;

  // Find calls out and calls in
  const callsOut = [];
  const callsIn = [];
  edges.forEach(e => {
    const sid = e.source.id || e.source;
    const tid = e.target.id || e.target;
    if (sid === d.id && nodeMap[tid]) callsOut.push(nodeMap[tid]);
    if (tid === d.id && nodeMap[sid]) callsIn.push(nodeMap[sid]);
  });

  let html = '';

  html += `<div class="detail-section-title">Calls (${callsOut.length})</div>`;
  if (callsOut.length === 0) {
    html += `<div class="detail-empty">No outgoing calls</div>`;
  } else {
    html += '<ul class="detail-list">';
    callsOut.forEach(n => {
      html += `<li data-node="${n.id}"><span class="ref-dot" style="background:${n.color}"></span>${n.name}<span class="ref-file">${n.file}:${n.line}</span></li>`;
    });
    html += '</ul>';
  }

  html += `<div class="detail-section-title">Called by (${callsIn.length})</div>`;
  if (callsIn.length === 0) {
    html += `<div class="detail-empty">No incoming calls</div>`;
  } else {
    html += '<ul class="detail-list">';
    callsIn.forEach(n => {
      html += `<li data-node="${n.id}"><span class="ref-dot" style="background:${n.color}"></span>${n.name}<span class="ref-file">${n.file}:${n.line}</span></li>`;
    });
    html += '</ul>';
  }

  html += `<div class="detail-section-title">Stats</div>`;
  html += `<div style="padding:4px 8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);line-height:1.8">
    In-degree: ${d.inDegree}<br>Out-degree: ${d.outDegree}<br>Total: ${d.inDegree + d.outDegree}
  </div>`;

  document.getElementById('detail-body').innerHTML = html;

  // Click on refs to navigate
  document.querySelectorAll('#detail-body li[data-node]').forEach(li => {
    li.addEventListener('click', () => {
      const targetNode = nodeMap[li.dataset.node];
      if (targetNode) {
        selectedNode = targetNode.id;
        const { connected, connEdges } = getConnected(targetNode.id);
        applyHighlight(connected, connEdges);
        showDetail(targetNode);
        // Pan to node
        const transform = d3.zoomTransform(svg.node());
        const x = targetNode.x * transform.k + transform.x;
        const y = targetNode.y * transform.k + transform.y;
        const dx = width / 2 - x;
        const dy = height / 2 - y;
        svg.transition().duration(500).call(
          zoom.transform,
          transform.translate(dx / transform.k, dy / transform.k)
        );
      }
    });
  });
}

// ── Search ──
const searchInput = document.getElementById('search-input');
let searchHits = new Set();

searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  if (!q) { clearSearch(); return; }

  searchHits = new Set();
  const hitEdges = new Set();

  nodes.forEach(n => {
    if (n.name.toLowerCase().includes(q)) searchHits.add(n.id);
  });

  edges.forEach((e, i) => {
    const sid = e.source.id || e.source;
    const tid = e.target.id || e.target;
    if (searchHits.has(sid) || searchHits.has(tid)) hitEdges.add(i);
  });

  circles.classed('search-hit', d => searchHits.has(d.id));
  circles.classed('dimmed', d => !searchHits.has(d.id) && searchHits.size > 0);
  labels.classed('dimmed', d => !searchHits.has(d.id) && searchHits.size > 0);
  linkSelection.classed('dimmed', (d, i) => !hitEdges.has(i) && searchHits.size > 0);
  linkSelection.classed('search-hit', (d, i) => hitEdges.has(i));

  // If single result, pan to it
  if (searchHits.size === 1) {
    const nodeId = [...searchHits][0];
    const n = nodeMap[nodeId];
    const transform = d3.zoomTransform(svg.node());
    svg.transition().duration(400).call(
      zoom.transform,
      d3.zoomIdentity.translate(width / 2, height / 2).scale(transform.k).translate(-n.x, -n.y)
    );
  }
});

function clearSearch() {
  searchHits = new Set();
  circles.classed('search-hit', false).classed('dimmed', false);
  labels.classed('dimmed', false);
  linkSelection.classed('dimmed', false).classed('search-hit', false);
}

// ── File visibility ──
function applyVisibility() {
  circles.attr('display', d => hiddenFiles.has(d.file) ? 'none' : null);
  labels.attr('display', d => hiddenFiles.has(d.file) ? 'none' : null);
  linkSelection.attr('display', d => {
    const sf = (nodeMap[d.source.id || d.source] || {}).file;
    const tf = (nodeMap[d.target.id || d.target] || {}).file;
    return (hiddenFiles.has(sf) || hiddenFiles.has(tf)) ? 'none' : null;
  });
}

// ── Window resize ──
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  svg.attr('width', w).attr('height', h);
});
</script>

</body>
</html>
