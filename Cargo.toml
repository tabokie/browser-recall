[package]
name = "portal-extension"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
chrono = { version = "0.4", features = ["wasmbind"] }
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  'console',
  'Window',
  'Document',
  'Element',
  'HtmlElement',
  'Node',
]

[profile.release]
opt-level = "z"
lto = true
