[package]
name = "browser-recall-desktop"
version = "1.0.1"
edition = "2021"

[build-dependencies]
serde_json = "1.0"
tauri-build = { version = "2", features = [] }

[dependencies]
browser-recall-daemon = { path = "../../../crates/daemon" }
browser-recall-replay = { path = "../../../crates/replay" }
chrono = "0.4"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sys-locale = "0.3"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tokio = { version = "1.44", features = ["time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "=2.12.0"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSView", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry"] }

[[test]]
name = "macos_window_frame"
harness = false

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
