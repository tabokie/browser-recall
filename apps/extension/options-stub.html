<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Recall</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at top,
            rgba(197, 137, 64, 0.18),
            transparent 36%
          ),
          linear-gradient(180deg, #fff9f1, #f4eee2);
        color: #3d3427;
      }

      main {
        width: min(560px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid rgba(121, 90, 43, 0.14);
        border-radius: 20px;
        background: rgba(255, 252, 245, 0.9);
        box-shadow: 0 18px 50px rgba(83, 61, 23, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        text-align: center;
      }

      p {
        margin: 0 0 14px;
        line-height: 1.5;
        color: #645641;
      }

      .intro {
        text-align: center;
      }

      section {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid rgba(121, 90, 43, 0.14);
      }

      h2 {
        margin: 0 0 12px;
        font-size: 15px;
        letter-spacing: 0.02em;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 10px 18px;
        background: #8f5a1f;
        color: #fff9f1;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #7d4e1d;
      }

      .button-row {
        display: flex;
        justify-content: center;
        margin-top: 18px;
      }

      .shortcut-list {
        display: grid;
        gap: 8px;
      }

      .shortcut-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 10px 12px;
        border: 1px solid rgba(121, 90, 43, 0.12);
        border-radius: 12px;
        background: rgba(255, 248, 236, 0.8);
      }

      .shortcut-desc {
        min-width: 0;
        text-align: left;
      }

      .shortcut-key {
        flex: 0 0 auto;
        padding: 4px 8px;
        border-radius: 8px;
        background: #ead8bd;
        color: #4c3418;
        font-size: 12px;
        font-weight: 700;
      }

      .shortcut-key.not-set {
        background: rgba(130, 104, 67, 0.12);
        color: #8a6d45;
      }

      #notRunning {
        margin-top: 14px;
        color: #9b2c2c;
        text-align: center;
      }

      #notRunning[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Browser Recall</h1>
      <p class="intro">
        The main Browser Recall interface runs in the desktop app.
      </p>
      <div class="button-row">
        <button id="openApp">Open Browser Recall</button>
      </div>
      <p id="notRunning" hidden>
        Can't open the app? Launch it from your Applications folder, then try
        again.
      </p>

      <section>
        <h2>Keyboard Shortcuts</h2>
        <div class="shortcut-list" id="shortcutsList"></div>
        <div class="button-row">
          <button id="customizeShortcuts">Configure Shortcuts</button>
        </div>
      </section>
    </main>
    <script src="browser-api.js"></script>
    <script type="module" src="options-stub.js"></script>
  </body>
</html>
