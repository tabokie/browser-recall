<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="extensionName">Browser Recall</title>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="extension-surface.css" />
    <style>
      body {
        display: grid;
        align-items: start;
      }

      .button-row {
        margin-top: 14px;
      }

      .shortcut-list {
        display: grid;
        gap: 0;
      }

      .shortcut-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        padding: 9px 0;
        border-top: 1px dotted var(--border-section);
      }

      .shortcut-desc {
        min-width: 0;
        color: var(--text-secondary);
        overflow-wrap: anywhere;
      }

      .shortcut-key {
        flex: 0 0 auto;
        padding: 2px 6px;
        border: 1px solid var(--border-section);
        border-radius: 2px;
        color: var(--text-primary);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .shortcut-key.not-set {
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <main class="extension-page">
      <div class="extension-ledger">
        <section class="extension-section">
          <div class="extension-brand" data-i18n="extensionName">
            Browser Recall
          </div>
          <h1 class="extension-title" data-i18n="extensionDesktopControl">
            Desktop Control
          </h1>
          <p class="extension-copy" data-i18n="extensionMainUiRunsInDesktop">
            The main Browser Recall interface runs in the desktop app.
          </p>
          <div class="button-row">
            <button
              class="extension-button primary"
              id="openApp"
              data-i18n="extensionOpenBrowserRecall"
            >
              Open Browser Recall
            </button>
          </div>
          <p
            class="extension-notice"
            id="notRunning"
            hidden
            data-i18n="extensionOpenAppFallback"
          >
            Can't open the app? Launch it from your system's app launcher, then
            try again.
          </p>
        </section>

        <section class="extension-section">
          <h2
            class="extension-section-title"
            data-i18n="extensionKeyboardShortcuts"
          >
            Keyboard Shortcuts
          </h2>
          <div class="shortcut-list" id="shortcutsList"></div>
          <div class="button-row">
            <button
              class="extension-button"
              id="customizeShortcuts"
              data-i18n="extensionConfigureShortcuts"
            >
              Configure Shortcuts
            </button>
          </div>
        </section>
      </div>
    </main>
    <script src="browser-api.js"></script>
    <script type="module" src="options-stub.js"></script>
  </body>
</html>
