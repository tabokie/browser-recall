<!doctype html>
<html style="background: #f7f4ea">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="extensionShortName">browser-recall</title>
    <style>
      html {
        background: #f7f4ea;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        color-scheme: light;
        --bg-base: #f7f4ea;
        --bg-ambient: #f7f4ea;
        --bg-surface: transparent;
        --bg-surface-solid: #f7f4ea;
        --bg-surface-hover: rgba(23, 23, 19, 0.055);
        --bg-surface-active: rgba(23, 23, 19, 0.08);
        --bg-sidebar: transparent;
        --bg-frosted: transparent;
        --bg-frosted-strong: #f7f4ea;
        --bg-input: transparent;
        --bg-warm-tint: transparent;
        --bg-warm-hover: rgba(23, 23, 19, 0.055);
        --bg-tab-active: rgba(23, 23, 19, 0.08);
        --border-glass: rgba(23, 23, 19, 0.22);
        --border-glass-strong: rgba(23, 23, 19, 0.32);
        --border-subtle: rgba(23, 23, 19, 0.12);
        --border-hover: rgba(23, 23, 19, 0.45);
        --border-section: rgba(23, 23, 19, 0.22);
        --scrollbar-thumb: rgba(23, 23, 19, 0.24);
        --text-primary: #171713;
        --text-secondary: #4b4b45;
        --text-muted: #77746a;
        --shadow-color: 0, 0, 0;
        --accent-primary: #171713;
        --accent-primary-hover: #000000;
        --accent-primary-glow: rgba(23, 23, 19, 0.14);
        --accent-primary-soft: rgba(23, 23, 19, 0.055);
        --accent-on-primary: #f7f4ea;
        --accent-blue: #171713;
        --accent-blue-soft: rgba(23, 23, 19, 0.055);
        --accent-green: #171713;
        --accent-green-soft: rgba(23, 23, 19, 0.08);
        --accent-red: #ff2d20;
        --accent-red-soft: rgba(255, 45, 32, 0.14);
        --recording-hot: #ff2d20;
        --recording-hot-soft: rgba(255, 45, 32, 0.14);
        --shadow-float: none;
        --shadow-float-hover: none;
        --shadow-elevated: none;
        --highlight-top: none;
        --highlight-top-strong: none;
        --highlight-edge: none;
        --radius-pill: 3px;
        --radius-xl: 3px;
        --radius-lg: 3px;
        --radius-md: 3px;
        --radius-sm: 3px;
        --ease-smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
        --font-display:
          ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono',
          monospace;
        --font-display-weight: 700;
        --font-body:
          ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono',
          monospace;
        width: 296px;
        min-height: 320px;
        font-family: var(--font-body);
        font-size: 12px;
        line-height: 1.45;
        color: var(--text-primary);
        background: var(--bg-ambient);
        background-attachment: fixed;
        padding: 0;
      }

      body.popup-compact {
        min-height: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid var(--border-subtle);
        border-top-color: var(--text-secondary);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        flex-shrink: 0;
      }

      html,
      body,
      .list-picker-list {
        scrollbar-color: transparent transparent;
        scrollbar-gutter: auto;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      .list-picker-list::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      html::-webkit-scrollbar-track,
      body::-webkit-scrollbar-track,
      .list-picker-list::-webkit-scrollbar-track,
      html::-webkit-scrollbar-corner,
      body::-webkit-scrollbar-corner,
      .list-picker-list::-webkit-scrollbar-corner {
        background: transparent;
      }

      html::-webkit-scrollbar-thumb,
      body::-webkit-scrollbar-thumb,
      .list-picker-list::-webkit-scrollbar-thumb {
        background: transparent;
        border: none;
      }

      html:hover::-webkit-scrollbar-thumb,
      body:hover::-webkit-scrollbar-thumb,
      .list-picker-list:hover::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
      }

      html,
      body {
        scrollbar-width: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      html[data-theme='dark'] body {
        color-scheme: light;
        --bg-base: #f7f4ea;
        --bg-ambient: #f7f4ea;
        --bg-surface: transparent;
        --bg-surface-solid: #f7f4ea;
        --bg-surface-hover: rgba(23, 23, 19, 0.055);
        --bg-surface-active: rgba(23, 23, 19, 0.08);
        --bg-frosted-strong: #f7f4ea;
        --bg-input: transparent;
        --bg-warm-tint: transparent;
        --bg-warm-hover: rgba(23, 23, 19, 0.055);
        --bg-tab-active: rgba(23, 23, 19, 0.08);
        --border-glass: rgba(23, 23, 19, 0.22);
        --border-glass-strong: rgba(23, 23, 19, 0.32);
        --border-subtle: rgba(23, 23, 19, 0.12);
        --border-hover: rgba(23, 23, 19, 0.45);
        --border-section: rgba(23, 23, 19, 0.22);
        --scrollbar-thumb: rgba(23, 23, 19, 0.24);
        --text-primary: #171713;
        --text-secondary: #4b4b45;
        --text-muted: #77746a;
        --accent-primary: #171713;
        --accent-primary-hover: #000000;
      }

      .popup-shell {
        background: transparent;
        border: none;
        border-radius: 0;
        box-shadow: none;
        overflow: visible;
        position: relative;
      }

      .popup-shell::before {
        display: none;
      }

      .header {
        padding: 15px 14px;
        border-bottom: 1px solid var(--border-section);
        background: transparent;
        position: relative;
      }

      .page-title {
        font-family: var(--font-display);
        font-size: 14px;
        font-weight: var(--font-display-weight);
        letter-spacing: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
        margin-bottom: 2px;
      }

      .page-title:hover {
        color: var(--accent-primary);
      }

      .page-title-input {
        font-family: var(--font-display);
        font-size: 14px;
        font-weight: var(--font-display-weight);
        width: 100%;
        border: 1px solid var(--accent-primary);
        border-radius: var(--radius-sm);
        padding: 1px 6px;
        outline: none;
        background: var(--bg-input);
        color: var(--text-primary);
      }

      .page-url {
        margin-top: 6px;
        font-size: 11px;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }

      .page-url:hover {
        color: var(--accent-primary);
      }

      .section {
        border-bottom: 1px solid var(--border-section);
        padding: 12px 14px;
        position: relative;
      }

      .section:last-child {
        border-bottom: none;
      }

      #visitsLikesSection {
        padding: 0;
      }

      .section-header {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        margin-bottom: 6px;
      }

      .section-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--text-muted);
      }

      .label-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        color: var(--text-muted);
        font-size: 10px;
        letter-spacing: 0.02em;
      }

      .section-action {
        width: 100%;
        margin-top: 10px;
        background: transparent;
        border: 1px solid var(--text-primary);
        border-radius: 2px;
        padding: 8px;
        cursor: pointer;
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.12em;
        color: var(--text-primary);
        text-transform: uppercase;
        box-shadow: none;
        transition:
          background 0.16s var(--ease-smooth),
          color 0.16s var(--ease-smooth);
      }

      .section-action:hover {
        background: var(--text-primary);
        color: var(--bg-base);
      }

      .section-action.subtle {
        font-size: 11px;
        padding: 2px 8px;
      }

      #snapshotSection.is-empty .section-action {
        margin-top: 0;
      }

      .snapshot-list {
        display: flex;
        flex-direction: column;
      }

      .snapshot-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 4px 0;
        border-top: 1px dotted var(--border-section);
        cursor: pointer;
      }

      .snapshot-row:first-child {
        border-top: 0;
      }

      .snapshot-time {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .snapshot-badges {
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .snapshot-row:hover {
        background: var(--bg-surface-hover);
        border-radius: 0;
      }

      .badge {
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 2px;
        font-weight: 800;
        letter-spacing: 0.06em;
        cursor: default;
        border: 1px solid transparent;
      }

      .badge.html {
        background: var(--accent-primary-soft);
        color: var(--accent-primary);
        border-color: var(--accent-primary-soft);
      }

      .badge.md {
        background: var(--accent-blue-soft);
        color: var(--accent-blue);
        border-color: rgba(80, 128, 176, 0.12);
      }

      .delete-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 14px;
        color: var(--text-muted);
        padding: 0 2px;
      }

      .delete-btn:hover {
        color: var(--text-primary);
      }

      .attention-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0;
      }

      .attention-item {
        display: block;
        padding: 10px 14px;
        border-right: 1px solid var(--border-section);
        font-size: 12px;
        color: var(--text-secondary);
      }

      .attention-item:last-child {
        border-right: 0;
      }

      .attention-item strong {
        display: block;
        margin-bottom: 2px;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      .attention-item .metric-value {
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 900;
      }

      .notes-scroll {
        display: flex;
        flex-direction: column;
      }

      .markup-controls {
        margin-bottom: 0;
        padding-bottom: 14px;
      }

      .markup-toggle-btn {
        width: 100%;
        background: transparent;
        border: 1px solid var(--text-primary);
        border-radius: 2px;
        min-height: 34px;
        padding: 8px;
        cursor: pointer;
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.12em;
        box-shadow: none;
        color: var(--text-primary);
        text-align: center;
        text-transform: uppercase;
        text-indent: -0.45em;
        transition:
          background 0.16s var(--ease-smooth),
          color 0.16s var(--ease-smooth);
      }

      .markup-toggle-btn:hover {
        background: var(--text-primary);
        color: var(--bg-base);
      }

      .markup-toggle-btn.is-markup-hidden {
        background: var(--text-primary);
        color: var(--bg-base);
      }

      .highlight-list {
        display: flex;
        flex-direction: column;
      }

      .highlight-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 0.02em;
        margin-bottom: 4px;
      }

      .empty-state {
        font-size: 12px;
        color: var(--text-muted);
        padding: 8px 0;
        text-align: center;
      }

      .page-diagnostic-title {
        font-family: var(--font-display);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.12em;
        line-height: 1.35;
        color: var(--text-primary);
        text-transform: uppercase;
      }

      .page-diagnostic-message {
        margin-top: 6px;
        font-size: 11px;
        color: var(--text-muted);
      }

      .page-diagnostic-detail {
        margin-top: 10px;
      }

      .page-diagnostic-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 12px;
      }

      .page-diagnostic-link {
        align-self: flex-start;
        border: none;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-family: var(--font-body);
        font-size: 11px;
        padding: 0;
      }

      .page-diagnostic-link:hover {
        color: var(--text-primary);
      }

      .list-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }

      .list-chip {
        display: block;
        max-width: 100%;
        padding: 5px 9px;
        border-radius: 2px;
        font-size: 11px;
        font-weight: 700;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        border: 1px solid var(--border-glass);
        box-shadow: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition:
          border-color 0.16s var(--ease-smooth),
          background 0.16s var(--ease-smooth),
          color 0.16s var(--ease-smooth);
      }

      .list-chip:hover {
        background: var(--bg-warm-hover);
        border-color: var(--border-hover);
        color: var(--text-primary);
      }

      .list-chip.selected {
        background: var(--text-primary);
        color: var(--bg-base);
        border-color: var(--text-primary);
        box-shadow: none;
      }

      .list-add-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 5px 9px;
        border: 1px solid var(--border-glass);
        border-radius: 2px;
        font-size: 11px;
        font-weight: 800;
        color: var(--text-muted);
        cursor: pointer;
        background: transparent;
        box-shadow: none;
        transition:
          border-color 0.16s var(--ease-smooth),
          background 0.16s var(--ease-smooth),
          color 0.16s var(--ease-smooth);
        user-select: none;
        flex-shrink: 0;
      }

      .list-add-btn:hover {
        background: var(--bg-warm-hover);
        border-color: var(--border-hover);
        color: var(--text-primary);
      }

      .list-chips-wrap {
        position: relative;
      }

      .list-search-capture {
        position: fixed;
        left: -10000px;
        top: 0;
        width: 1px;
        height: 1px;
        padding: 0;
        border: 0;
        opacity: 0;
        pointer-events: none;
      }

      .list-picker-host {
        display: contents;
      }

      .list-picker-host .list-picker-list-row {
        display: none;
      }

      .list-picker {
        --list-picker-scroll-gutter-width: 24px;
        position: fixed;
        display: flex;
        flex-direction: column;
        margin: 0;
        background: var(--bg-surface-solid);
        border: 2px solid var(--text-primary);
        border-radius: 2px;
        box-shadow: none;
        z-index: 100;
        overflow: hidden;
      }

      .list-picker.list-picker-has-scroll .list-picker-list-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) var(
            --list-picker-scroll-gutter-width
          );
      }

      .list-picker-input {
        display: block;
        width: 100%;
        font-size: 11px;
        margin: 0;
        padding: 8px 12px;
        border: 0;
        border-bottom: 2px solid var(--text-primary);
        outline: none;
        font-family: var(--font-body);
        box-sizing: border-box;
        background: var(--bg-surface-solid);
        color: var(--text-primary);
      }

      .list-picker-input::placeholder {
        color: var(--text-muted);
      }

      .list-picker-input:focus {
        border-bottom-color: var(--accent-primary);
      }

      .list-picker-list {
        position: relative;
        max-height: var(--list-picker-list-max-height, 160px);
        overflow-x: hidden;
        overflow-y: hidden;
        scrollbar-color: transparent transparent;
      }

      .list-picker-list::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      .list-picker-list::-webkit-scrollbar-thumb {
        background: transparent;
        border-radius: 0;
      }

      .list-picker-list:hover::-webkit-scrollbar-thumb {
        background: transparent;
      }

      .list-picker.list-picker-has-scroll .list-picker-list {
        box-shadow: inset -1px 0 0 var(--border-subtle);
      }

      .list-picker-options {
        will-change: transform;
      }

      .list-picker-scroll-thumb {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        min-height: 12px;
        background: var(--text-primary);
        border-radius: 0;
        pointer-events: none;
        z-index: 102;
      }

      .list-picker-scrollbar {
        position: relative;
        display: none;
        box-sizing: border-box;
      }

      .list-picker.list-picker-has-scroll .list-picker-scrollbar {
        display: block;
      }

      .list-picker-option:not(:last-child) {
        border-bottom: 1px solid var(--border-subtle);
      }

      .list-picker.list-picker-has-scroll .list-picker-option {
        width: 100%;
      }

      .list-picker-option {
        box-sizing: border-box;
      }

      .list-picker-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        font-size: 11px;
        color: var(--text-primary);
        cursor: pointer;
        transition: background 0.1s;
      }

      .list-picker-row:hover,
      .list-picker-row.active {
        background: var(--bg-surface-hover);
      }

      .list-picker-row.selected {
        color: var(--accent-primary);
      }

      .list-picker-row-check {
        width: 14px;
        font-size: 10px;
        text-align: center;
        flex-shrink: 0;
      }

      .list-picker-create {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        font-size: 11px;
        color: var(--text-muted);
        font-style: italic;
        cursor: pointer;
        transition: background 0.1s;
      }

      .list-picker-create:hover,
      .list-picker-create.active {
        background: var(--bg-surface-hover);
        color: var(--text-secondary);
      }

      #dashboard {
        display: flex;
        flex-direction: column;
        gap: 0;
        border: 1px solid var(--border-glass-strong);
      }

      .recording-bar {
        display: grid;
        grid-template-columns: 1fr;
        align-items: stretch;
        gap: 0;
        padding: 0;
        border-bottom: 1px solid var(--border-section);
      }

      .recording-state {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 42px;
        align-items: stretch;
        gap: 0;
        flex: 1;
        min-width: 0;
        padding: 0;
        border: 0;
        background: var(--bg-base);
      }

      .recording-toggle {
        grid-column: 2;
        grid-row: 1;
        position: relative;
        width: 42px;
        height: 42px;
        border-radius: 0;
        border: none;
        background: var(--accent-primary);
        color: var(--bg-base);
        box-shadow: none;
        cursor: pointer;
        flex: 0 0 auto;
        border-left: 1px solid var(--border-section);
        transition: background 0.16s var(--ease-smooth);
      }

      .recording-toggle::before {
        content: '';
        position: absolute;
        top: 13px;
        left: 13px;
        width: 5px;
        height: 16px;
        border: none;
        border-radius: 0;
        background: var(--bg-base);
        box-shadow: 11px 0 0 var(--bg-base);
      }

      .recording-toggle::after {
        display: none;
      }

      .recording-toggle:hover {
        background: var(--recording-hot);
      }

      .recording-toggle:hover::before {
        background: var(--accent-primary);
        box-shadow: 11px 0 0 var(--accent-primary);
      }

      .recording-bar.is-paused .recording-toggle {
        background: var(--bg-base);
      }

      .recording-bar.is-paused .recording-toggle::before {
        inset: 10px;
        width: auto;
        height: auto;
        border: none;
        border-radius: 50%;
        background: var(--recording-hot);
        box-shadow: none;
      }

      .recording-bar.is-paused .recording-toggle:hover {
        background: var(--recording-hot);
      }

      .recording-bar.is-paused .recording-toggle:hover::before {
        background: var(--accent-primary);
        box-shadow: none;
      }

      .recording-bar.is-paused .recording-toggle::after {
        display: none;
      }

      .recording-copy {
        grid-column: 1;
        grid-row: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        min-width: 0;
        padding: 7px 14px;
        cursor: pointer;
        transition:
          background 0.16s var(--ease-smooth),
          color 0.16s var(--ease-smooth);
      }

      .recording-copy:hover {
        background: var(--text-primary);
        color: var(--bg-base);
      }

      .recording-copy:hover .recording-label {
        color: var(--bg-base);
      }

      .recording-label {
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.12em;
        line-height: 1.15;
        text-transform: uppercase;
        color: var(--text-primary);
      }

      .recording-meta {
        font-size: 11px;
        line-height: 1.25;
        color: var(--text-muted);
      }

      .loading {
        padding: 32px;
      }

      .capture-once-btn {
        padding: 7px 12px;
        border: none;
        border-radius: 2px;
        background: var(--accent-primary);
        color: var(--bg-base);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.02em;
        cursor: pointer;
        margin-bottom: 12px;
        box-shadow: none;
      }

      .capture-once-btn:hover {
        background: var(--accent-primary-hover);
      }

      .capture-once-btn:disabled {
        background: var(--text-muted);
        border-color: var(--text-muted);
        cursor: default;
      }

      .setup-required {
        padding: 14px;
        color: var(--text-secondary);
      }

      .setup-ledger {
        border-top: 1px solid var(--border-section);
        border-bottom: 1px solid var(--border-section);
        padding: 13px 0 14px;
      }

      .setup-brand {
        display: flex;
        margin-bottom: 13px;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.08em;
      }

      .setup-required-title {
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: 0.02em;
        color: var(--text-primary);
        text-transform: uppercase;
      }

      .setup-required-meta {
        margin-top: 8px;
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1.45;
        min-height: calc(11px * 1.45 * 2);
        overflow-wrap: anywhere;
        white-space: normal;
      }

      .setup-diagnostic {
        display: none;
        margin-top: 10px;
        padding-top: 9px;
        border-top: 1px solid var(--border-section);
        color: var(--text-muted);
        font-size: 10px;
        line-height: 1.55;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .setup-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 15px;
      }

      .setup-action-btn {
        position: relative;
        width: 100%;
        min-height: 34px;
        padding: 9px 10px;
        border: 1px solid var(--text-primary);
        border-radius: 2px;
        background: transparent;
        color: var(--text-primary);
        cursor: pointer;
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-align: left;
        text-transform: uppercase;
        overflow: hidden;
        transition:
          background 0.16s var(--ease-smooth),
          border-color 0.16s var(--ease-smooth),
          color 0.16s var(--ease-smooth);
      }

      .setup-action-btn.primary {
        background: var(--text-primary);
        color: var(--bg-base);
      }

      .setup-action-btn:hover {
        background: var(--text-primary);
        border-color: var(--text-primary);
        color: var(--bg-base);
      }

      .setup-action-btn:disabled {
        border-color: var(--border-section);
        background: transparent;
        color: var(--text-muted);
        cursor: default;
      }

      .setup-action-btn.is-checking {
        border-color: var(--text-primary);
        color: var(--text-primary);
      }

      .setup-action-btn.is-checking::after {
        content: '';
        position: absolute;
        top: 50%;
        right: 11px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--recording-hot);
        transform: translateY(-50%);
        animation: setup-check-dot 0.82s step-end infinite;
      }

      @keyframes setup-check-dot {
        0%,
        68% {
          opacity: 0;
        }

        68.01%,
        100% {
          opacity: 1;
        }
      }
    </style>
    <link rel="stylesheet" href="color-schemes.css" />
  </head>
  <body>
    <div id="loading" class="popup-shell loading" style="display: none">
      <span class="spinner"></span>
    </div>

    <div
      id="setup-required"
      class="popup-shell setup-required"
      style="display: none"
    >
      <div class="setup-ledger">
        <div class="setup-brand" data-i18n="extensionName">BROWSER RECALL</div>
        <div
          class="setup-required-title"
          id="setupRequiredTitle"
          data-i18n="extensionDesktopOffline"
        >
          DESKTOP OFFLINE
        </div>
        <div
          class="setup-required-meta"
          id="setupRequiredMeta"
          data-i18n="extensionStartDesktop"
        >
          Start Browser Recall Desktop to resume live capture.
        </div>
        <div class="setup-diagnostic" id="setupDiagnostic"></div>
        <div class="setup-actions">
          <button
            class="setup-action-btn primary"
            id="setupRequiredBtn"
            data-i18n="extensionOpenDesktop"
          >
            Open Desktop
          </button>
          <button
            class="setup-action-btn"
            id="setupDesktopConnectBtn"
            data-i18n="extensionCheckAgain"
          >
            Check Again
          </button>
        </div>
      </div>
    </div>

    <div id="dashboard">
      <div class="recording-bar" id="recordingBar">
        <div class="recording-state">
          <button
            class="recording-toggle"
            id="recordingToggle"
            aria-label="Toggle recording"
            aria-pressed="false"
            title="Pause tracing"
            data-i18n-aria-label="extensionToggleRecording"
            data-i18n-title="extensionPauseTracing"
          ></button>
          <div class="recording-copy">
            <div
              class="recording-label"
              id="recordingLabel"
              data-i18n="extensionName"
            >
              BROWSER RECALL
            </div>
          </div>
        </div>
      </div>

      <div id="dashboardContent">
        <div class="section" id="pageDiagnosticSection" style="display: none">
          <div class="page-diagnostic-title" id="pageDiagnosticTitle"></div>
          <div class="page-diagnostic-message" id="pageDiagnosticMessage"></div>
          <div
            class="setup-diagnostic page-diagnostic-detail"
            id="pageDiagnosticDetail"
          ></div>
          <div class="page-diagnostic-actions" id="pageDiagnosticActions"></div>
        </div>

        <div class="header" id="pageHeader">
          <div class="page-title" id="pageTitle" data-i18n="extensionName">
            BROWSER RECALL
          </div>
          <div
            class="page-url"
            id="pageUrl"
            data-i18n="extensionCurrentPageReceipt"
          >
            current page receipt
          </div>
        </div>

        <div class="section" id="visitsLikesSection" style="display: none">
          <div class="attention-grid" id="attentionGrid"></div>
        </div>

        <div class="section" id="listSection" style="display: none">
          <div class="label-row">
            <span data-i18n="commonLists">Lists</span
            ><span id="listCount">00</span>
          </div>
          <div class="list-chips-wrap">
            <div class="list-chips" id="listChips"></div>
          </div>
        </div>

        <div class="section" id="notesSection" style="display: none">
          <div class="notes-scroll">
            <div class="markup-controls" id="markupControls"></div>
            <div class="highlight-list" id="highlightList"></div>
          </div>
        </div>

        <div class="section" id="snapshotSection" style="display: none">
          <div class="snapshot-list" id="snapshotList"></div>
          <button
            class="section-action"
            id="captureBtn"
            data-i18n="extensionCaptureFrame"
          >
            CAPTURE FRAME
          </button>
        </div>
      </div>
      <!-- Native IME composition belongs to this node; keep it mounted and unreparented for the popup lifetime. -->
      <div class="list-picker-host" id="listPickerHost">
        <input
          class="list-search-capture"
          id="listSearchInput"
          type="text"
          tabindex="-1"
          aria-hidden="true"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <div class="list-picker-list-row">
          <div class="list-picker-list" id="listPickerList" role="listbox">
            <div class="list-picker-options" id="listPickerOptions"></div>
          </div>
          <div
            class="list-picker-scrollbar"
            id="listPickerScrollbar"
            aria-hidden="true"
          >
            <div
              class="list-picker-scroll-thumb"
              id="listPickerScrollThumb"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <script src="browser-api.js"></script>
    <script src="extension-surface.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
